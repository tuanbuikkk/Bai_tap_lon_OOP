plugins {
    id 'com.android.application'
}

// Đọc local.properties (không commit). Thiếu key thì dùng giá trị mặc định.
def localProps = new Properties()
def lp = rootProject.file("local.properties")
if (lp.exists()) {
    lp.withInputStream { localProps.load(it) }
}
def prop = { key, defaultValue ->
    localProps.getProperty(key, defaultValue).replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace 'com.yourteam.englishapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.yourteam.englishapp"
        // minSdk 26: PBKDF2WithHmacSHA256 chỉ có từ Android 8.0
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "DB_HOST", "\"${prop('db.host', '10.0.2.2')}\""
        buildConfigField "String", "DB_PORT", "\"${prop('db.port', '1433')}\""
        buildConfigField "String", "DB_NAME", "\"${prop('db.name', 'EnglishApp')}\""
        buildConfigField "String", "DB_USER", "\"${prop('db.user', 'app_user')}\""
        buildConfigField "String", "DB_PASS", "\"${prop('db.password', '')}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources { excludes += ['META-INF/*'] }
    }
}

dependencies {
    // JDBC SQL Server
    implementation "net.sourceforge.jtds:jtds:1.3.1"

    // AndroidX
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.8.4"
    implementation "androidx.lifecycle:lifecycle-livedata:2.8.4"

    // Navigation
    implementation "androidx.navigation:navigation-fragment:2.7.7"
    implementation "androidx.navigation:navigation-ui:2.7.7"

    // UI
    implementation "com.google.android.material:material:1.12.0"

    // Lưu phiên an toàn
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    testImplementation "junit:junit:4.13.2"
}
